{% extends "base.html" %}
{% block content %}

<div class="mb-8">
  <h1 class="mono text-3xl font-bold mb-2">ATS Optimizer</h1>
  <p style="color: var(--muted);">Paste your JD and resume. Find every missing keyword before you apply.</p>
</div>

<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

  <!-- LEFT: INPUTS -->
  <div class="space-y-4">

    <div class="surface rounded-lg p-6">
      <label class="mono text-xs uppercase tracking-widest mb-3 block" style="color: var(--muted);">Job Description</label>
      <textarea id="jd-input" rows="10" placeholder="Paste the full job description..."
        class="w-full rounded px-4 py-3 text-sm focus:outline-none resize-none"
        style="background:#111; border:1px solid var(--border); color:var(--text);"></textarea>
    </div>

    <div class="surface rounded-lg p-6">
      <label class="mono text-xs uppercase tracking-widest mb-3 block" style="color: var(--muted);">Your Resume Text</label>
      <textarea id="resume-input" rows="10" placeholder="Paste your resume as plain text..."
        class="w-full rounded px-4 py-3 text-sm focus:outline-none resize-none"
        style="background:#111; border:1px solid var(--border); color:var(--text);"></textarea>

      <button class="btn-primary mt-4 w-full" onclick="runATS()">
        ANALYZE ATS FIT
      </button>
    </div>

  </div>

  <!-- RIGHT: RESULTS -->
  <div>

    <!-- Loading -->
    <div id="loading-panel" class="hidden surface rounded-lg p-8 text-center">
      <div class="mono text-sm mb-2" style="color: var(--accent);">Scanning keywords...</div>
      <div class="mono text-xs" style="color: var(--muted);">Comparing JD against your resume</div>
    </div>

    <!-- Error -->
    <div id="error-panel" class="hidden surface rounded-lg p-6">
      <div class="mono text-sm mb-2" style="color: #EF4444;">Error</div>
      <div id="error-message" class="text-sm" style="color: var(--muted);"></div>
    </div>

    <!-- Results -->
    <div id="results-panel" class="hidden space-y-4">

      <!-- ATS Score -->
      <div class="surface rounded-lg p-6 flex items-center justify-between">
        <div>
          <div class="mono text-xs uppercase tracking-widest mb-1" style="color: var(--muted);">ATS Score</div>
          <div id="ats-summary" class="text-sm" style="color: var(--muted); max-width: 260px;"></div>
        </div>
        <div class="text-right">
          <div id="ats-score" class="mono text-6xl font-bold"></div>
          <div class="mono text-xs" style="color: var(--muted);">/100</div>
        </div>
      </div>

      <!-- Missing Keywords -->
      <div class="surface rounded-lg p-5">
        <div class="mono text-xs uppercase tracking-widest mb-3" style="color: #EF4444;">Missing Keywords</div>
        <div id="missing-keywords" class="space-y-3"></div>
      </div>

      <!-- Weak Keywords -->
      <div class="surface rounded-lg p-5">
        <div class="mono text-xs uppercase tracking-widest mb-3" style="color: #F5A623;">Weak Keywords</div>
        <div id="weak-keywords" class="space-y-3"></div>
      </div>

      <!-- Strong Keywords -->
      <div class="surface rounded-lg p-5">
        <div class="mono text-xs uppercase tracking-widest mb-3" style="color: #22C55E;">Strong Keywords</div>
        <div id="strong-keywords" class="flex flex-wrap gap-2"></div>
      </div>

      <!-- Recommendations -->
      <div class="surface rounded-lg p-5">
        <div class="mono text-xs uppercase tracking-widest mb-3" style="color: var(--accent);">What to Fix</div>
        <ul id="recommendations" class="space-y-3 text-sm"></ul>
      </div>

    </div>
  </div>
</div>

<script>
async function runATS() {
  const jd = document.getElementById('jd-input').value.trim();
  const resume = document.getElementById('resume-input').value.trim();

  document.getElementById('results-panel').classList.add('hidden');
  document.getElementById('error-panel').classList.add('hidden');
  document.getElementById('loading-panel').classList.remove('hidden');

  try {
    const response = await fetch('/ats/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jd_text: jd, resume_text: resume })
    });

    const data = await response.json();
    if (data.error) { showError(data.error); return; }
    renderResults(data);

  } catch (err) {
    showError('Something went wrong. Check the server is running.');
  } finally {
    document.getElementById('loading-panel').classList.add('hidden');
  }
}

function renderResults(d) {
  // Score
  const score = d.ats_score;
  const scoreEl = document.getElementById('ats-score');
  scoreEl.textContent = score;
  scoreEl.style.color = score >= 80 ? '#22C55E' : score >= 60 ? '#F5A623' : '#EF4444';
  document.getElementById('ats-summary').textContent = d.summary;

  // Missing keywords
  document.getElementById('missing-keywords').innerHTML = d.missing_keywords.map(k => {
    const color = k.priority === 'HIGH' ? '#EF4444' : k.priority === 'MEDIUM' ? '#F5A623' : '#6B7280';
    return `<div class="flex gap-3 items-start text-sm">
      <span class="mono text-xs font-bold mt-0.5 w-16 shrink-0" style="color:${color};">${k.priority}</span>
      <div>
        <span class="font-semibold">${k.keyword}</span>
        <span class="ml-2 text-xs" style="color:var(--muted);">— ${k.context}</span>
      </div>
    </div>`;
  }).join('');

  // Weak keywords
  document.getElementById('weak-keywords').innerHTML = d.weak_keywords.map(k =>
    `<div class="text-sm">
      <span class="font-semibold">${k.keyword}</span>
      <span class="ml-2 text-xs" style="color:var(--muted);">↳ ${k.suggestion}</span>
    </div>`
  ).join('');

  // Strong keywords
  document.getElementById('strong-keywords').innerHTML = d.strong_keywords.map(k =>
    `<span class="mono text-xs px-3 py-1 rounded-full" style="background:rgba(34,197,94,0.1); color:#22C55E; border:1px solid rgba(34,197,94,0.3);">${k}</span>`
  ).join('');

  // Recommendations
  document.getElementById('recommendations').innerHTML = d.recommendations.map((r, i) =>
    `<li class="flex gap-3">
      <span class="mono text-xs font-bold mt-0.5" style="color:var(--accent);">${i + 1}.</span>
      <span>${r}</span>
    </li>`
  ).join('');

  document.getElementById('results-panel').classList.remove('hidden');
}

function showError(msg) {
  document.getElementById('error-message').textContent = msg;
  document.getElementById('error-panel').classList.remove('hidden');
}
</script>

{% endblock %}
