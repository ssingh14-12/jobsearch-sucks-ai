<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>jobsearch-sucks-ai</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #0D0D0D;
      --surface: #1A1A1A;
      --border: #2A2A2A;
      --accent: #72d4ed;
      --text: #F0F0F0;
      --muted: #6B7280;
      --go: #22C55E;
      --nogo: #EF4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cambria', sans-serif;
      min-height: 100vh;
    }
    .mono { font-family: 'Playfair Display', serif; }
    .accent { color: var(--accent #04a4cc); }
    .surface { background: var(--surface); border: 1px solid var(--border); }
    .btn-primary {
      background: var(--accent);
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 4px;
      cursor: pointer;
      transition: opacity 0.2s;
      border: none;
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    nav a { transition: color 0.2s; }
    nav a:hover { color: var(--accent); }
    nav a.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
  </style>
</head>
<body>

<!-- TOP NAV -->
<header style="border-bottom: 1px solid var(--border);">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <span class="mono text-lg font-bold" style="color: var(--accent);">jobsearch-sucks-ai</span>
    <nav class="flex gap-6 text-sm" style="color: var(--muted);">
  <a href="/screener" class="{% if request.path == '/screener' %}active{% endif %} pb-1">Screener</a>
  <a href="#" class="opacity-30 cursor-not-allowed pb-1">Resume Builder</a>
  <a href="/rewriter" class="{% if request.path == '/rewriter' %}active{% endif %} pb-1">Bullet Rewriter</a>
  <a href="/ats" class="{% if request.path == '/ats' %}active{% endif %} pb-1">ATS Optimizer</a>
</nav>
  </div>
</header>

<!-- PAGE CONTENT -->
<main class="max-w-6xl mx-auto px-6 py-10">
  {% block content %}{% endblock %}
</main>

</body>
</html>
